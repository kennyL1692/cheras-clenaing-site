<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Premium home and office cleaning in Cheras with instant demo quotes, WhatsApp booking, eco-friendly products, and trusted local cleaners.">
    <title>Cheras Sparkle Cleaners | Premium Cleaning in Cheras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['Manrope', 'Inter', 'system-ui', 'sans-serif'],
            },
            boxShadow: {
              glow: '0 24px 80px rgba(37, 99, 235, 0.18)',
              tealGlow: '0 24px 80px rgba(20, 184, 166, 0.18)',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
        }
        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-14px); }
        }
        @keyframes shimmer {
          0% { background-position: -200% center; }
          100% { background-position: 200% center; }
        }
        @keyframes pulseGlow {
          0%, 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35); }
          50% { box-shadow: 0 0 0 14px rgba(37, 99, 235, 0); }
        }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out forwards; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulseGlow { animation: pulseGlow 2.4s ease-in-out infinite; }
        .shimmer-text {
          background-size: 200% auto;
          animation: shimmer 5s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root">
        <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-sky-50 via-white to-cyan-50">
            <div class="animate-pulse text-blue-600 font-bold text-xl">Loading Cheras Sparkle...</div>
        </div>
    </div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
